[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryoednet"
version = "0.1.0"
description = "Manuscript-based reconstruction of CryoEDNet particle denoising"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "numpy>=1.26,<2", "mrcfile>=1.5,<2"]

[project.optional-dependencies]
deepinv = ["deepinv==0.2.2"]

[tool.setuptools.packages.find]
include = ["cryoednet*"]
